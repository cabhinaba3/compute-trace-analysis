[build-system]
requires = ["hatchling", "nanobind>=2.0", "cmake>=3.18", "ninja"]
build-backend = "hatchling.build"

[project]
name = "compute-trace-analysis"
dynamic = ["version"]
description = "Cross-platform multi-trace and multi-aspect performance comparison framework for AI/HPC schedules and GPU profilers"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.12"
authors = [
    { name = "Abhinaba Chakraborty", email = "abhinabacr4@gmail.com" }
]
keywords = [
    "profiling",
    "performance-analysis",
    "chakra",
    "goal",
    "nsight-systems",
    "nsight-compute",
    "kineto",
    "tensorrt",
    "jetson",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: GNU General Public License v2 (GPLv2)",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: System :: Benchmark",
]
dependencies = [
    "polars>=1.0.0",
    "pyarrow>=15.0.0",
    "numpy>=1.26.0",
    "scipy>=1.12.0",
    "pyyaml>=6.0.1",
    "typer>=0.12.0",
    "rich>=13.7.0",
    "matplotlib>=3.8.0",
]

[project.optional-dependencies]
pandas = ["pandas>=2.1.0"]
ncu = ["ncu-report>=2026.2.0"]  # NVIDIA's native .ncu-rep reader (wheels for macOS, Linux, Windows)
# NVIDIA nsight-python (git submodule, v1.1.1): kernel-profiling driver. Needs cuda-bindings/cuda-core, which have
# no macOS wheels, so it is Linux-only.
profile = ["nsight-python @ {root:uri}/third_party/nsight-python ; sys_platform == 'linux'"]
viz = ["plotly>=5.20"]  # interactive HTML plots and the dashboard (static PDF/SVG/PNG need only matplotlib)
jax = ["xprof>=2.24.2"]  # optional upstream xprof tools (CTA reads .xplane.pb, .pftrace and Chrome traces natively)
hta = ["traceinsight>=0.6.1"]  # Meta Holistic Trace Analysis; enables the opt-in `hta_kineto` aspect
sql = ["duckdb>=1.0.0"]  # SQL plots (`--sql`, the `custom` kind) and the `where` filter of raw-table plots
# Run table queries on an NVIDIA GPU (`--accelerator cuda`) with Polars' GPU engine; Linux and CUDA only. Needs
# NVIDIA's package index: pip install --extra-index-url=https://pypi.nvidia.com ".[gpu]". Not part of `all`.
gpu = ["polars[gpu]>=1.0.0"]
# Writing Chakra .et files from Python (the readers are native and need none of this). mlc-chakra is the official
# MLCommons schema, vendored as a pinned git submodule because PyPI's 1.0.0 predates STORAGE_NODE/DATA_OP_NODE;
# installing this extra needs `git clone --recurse-submodules`.
chakra = [
    "protobuf>=6.31.1",
    "mlc-chakra @ {root:uri}/third_party/chakra",
]
# The extras that add no heavy dependency (not hta, jax, ncu or profile, which pull in large or platform-bound packages).
all = [
    "pandas>=2.1.0",
    "plotly>=5.20",
    "duckdb>=1.0.0",
    "protobuf>=6.31.1",
    "mlc-chakra @ {root:uri}/third_party/chakra",
]
dev = [
    "hatchling",
    "pandas>=2.1.0",
    "plotly>=5.20",
    "duckdb>=1.0.0",
    "protobuf>=6.31.1",
    "mlc-chakra @ {root:uri}/third_party/chakra",
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.5.0",
    "mypy>=1.10.0",
    "types-PyYAML>=6.0.12",
]

[project.scripts]
cta = "cta.cli.app:main"

[project.urls]
Repository = "https://github.com/cabhinaba3/compute-trace-analysis"
Issues = "https://github.com/cabhinaba3/compute-trace-analysis/issues"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.version]
path = "src/cta/__init__.py"

[tool.hatch.build.hooks.custom]
path = "hatch_build.py"

[tool.hatch.build.targets.wheel]
packages = ["src/cta"]

[tool.ruff]
target-version = "py312"
line-length = 80  # Google Python Style Guide
extend-exclude = ["third_party", "scripts"]

[tool.ruff.lint]
# E/W pycodestyle, F pyflakes, I isort, N pep8-naming, D pydocstyle, B bugbear, UP pyupgrade,
# SIM simplify. Module-only imports (Google 2.2) has no ruff rule; tests/unit/test_code_style.py
# enforces it.
select = ["E", "W", "F", "I", "N", "D", "B", "UP", "SIM"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.isort]
# Google style: one import per line (typing / collections.abc excepted), sorted lexicographically
# within each section regardless of `import` vs `from`.
force-single-line = true
force-sort-within-sections = true
single-line-exclusions = ["typing", "collections.abc", "typing_extensions"]
order-by-type = false

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D103"]  # test function names state what they check

[tool.ruff.format]
docstring-code-format = true

[tool.mypy]
python_version = "3.12"
warn_unused_configs = true
disallow_untyped_defs = true
check_untyped_defs = true
exclude = ["third_party", "scripts"]

[[tool.mypy.overrides]]
# Third-party packages without type information. Only these may be missing:
# a missing first-party module is an error.
module = [
    "google.*",
    "hta.*",
    "jax.*",
    "jtop",
    "pandas.*",
    "plotly.*",
    "pyarrow.*",
    "scipy.*",
    "torch.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
# Test modules are imported by path, so they never shadow or import the
# source tree by accident. Keep test file names unique: mypy needs that.
addopts = "-q --import-mode=importlib"
