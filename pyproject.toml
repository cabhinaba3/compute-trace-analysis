[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "compute-trace-analysis"
dynamic = ["version"]
description = "Cross-platform multi-trace and multi-aspect performance comparison framework for AI/HPC schedules and GPU profilers"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
authors = [
    { name = "Abhinaba Chakraborty", email = "abhinabacr4@gmail.com" }
]
keywords = [
    "profiling",
    "performance-analysis",
    "chakra",
    "goal",
    "nsight-systems",
    "nsight-compute",
    "kineto",
    "tensorrt",
    "jetson",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: GNU General Public License v2 (GPLv2)",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: System :: Benchmark",
]
dependencies = [
    "polars>=1.0.0",
    "duckdb>=1.0.0",
    "pyarrow>=15.0.0",
    "numpy>=1.26.0",
    "scipy>=1.12.0",
    "protobuf>=6.31.1",
    # Official MLCommons Chakra schema, vendored as a pinned git submodule: PyPI mlc-chakra 1.0.0 predates
    # STORAGE_NODE/DATA_OP_NODE. Requires `git clone --recurse-submodules`.
    "mlc-chakra @ {root:uri}/third_party/chakra",
    "pyyaml>=6.0.1",
    "typer>=0.12.0",
    "rich>=13.7.0",
    "matplotlib>=3.8.0",
]

[project.optional-dependencies]
pandas = ["pandas>=2.1.0"]
ncu = ["ncu-report>=2026.2.0"]  # NVIDIA's native .ncu-rep reader (wheels for macOS, Linux, Windows)
# NVIDIA nsight-python (git submodule, v1.1.1): kernel-profiling driver. Needs cuda-bindings/cuda-core, which have
# no macOS wheels, so it is Linux-only.
profile = ["nsight-python @ {root:uri}/third_party/nsight-python ; sys_platform == 'linux'"]
hta = ["traceinsight>=0.6.1"]  # Meta Holistic Trace Analysis; enables the opt-in `hta_kineto` aspect
dev = [
    "pandas>=2.1.0",
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.5.0",
    "mypy>=1.10.0",
    "types-PyYAML>=6.0.12",
]

[project.scripts]
cta = "cta.cli.app:main"

[project.urls]
Repository = "https://github.com/cabhinaba3/compute-trace-analysis"
Issues = "https://github.com/cabhinaba3/compute-trace-analysis/issues"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.version]
path = "cta/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["cta"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
warn_unused_configs = true
disallow_untyped_defs = true
check_untyped_defs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
