name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install native build dependencies
        run: sudo apt-get update && sudo apt-get install -y g++ zlib1g-dev libsqlite3-dev libprotobuf-dev protobuf-compiler libsimdjson-dev

      - name: Install package & dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint (Ruff)
        run: ruff check src tests examples

      - name: Typecheck (Mypy)
        run: mypy src tests examples

      - name: Unit & Integration Tests (Pytest)
        run: pytest --cov=cta --cov-report=term-missing

  core-install:
    # The default install, with none of the optional packages: the command
    # line must work, and the features that need an extra must name it.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install native build dependencies
        run: sudo apt-get update && sudo apt-get install -y g++ zlib1g-dev libsqlite3-dev libprotobuf-dev protobuf-compiler libsimdjson-dev

      - name: Check this machine with configure.sh
        run: ./configure.sh

      - name: Install without extras
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pytest

      - name: Optional packages are absent
        run: |
          python - <<'PY'
          import importlib.util as u

          for name in ("duckdb", "chakra", "google.protobuf", "plotly", "pandas"):
              try:
                  found = u.find_spec(name) is not None
              except ModuleNotFoundError:  # the parent package is absent
                  found = False
              assert not found, f"{name} is installed"
          PY

      - name: Core features and install hints
        run: pytest tests/unit/test_install_extras.py
