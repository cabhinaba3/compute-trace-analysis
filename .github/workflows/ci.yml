name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install native build dependencies
        run: sudo apt-get update && sudo apt-get install -y g++ zlib1g-dev libsqlite3-dev libprotobuf-dev protobuf-compiler

      - name: Install package & dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint (Ruff)
        run: ruff check cta tests examples

      - name: Typecheck (Mypy)
        run: mypy cta tests examples

      - name: Unit & Integration Tests (Pytest)
        run: pytest --cov=cta --cov-report=term-missing
